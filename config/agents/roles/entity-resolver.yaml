role_id: entity-resolver
display_name: Khánh An
execution_kind: deterministic
mission: Normalize candidate identity, domain and duplicate relationships.
non_goals:
  - Never score commercial fit or infer intent.
workspace: workflow/lead-intelligence/entities
prompt_includes:
  - agents/shared/VIETNAMESE-LANGUAGE-POLICY.md
primary_model: none
fallback_model: none
reasoning_budget_seconds: 0
tools_allow:
  - candidate-write
tools_deny:
  - exec
  - credential-read

skills_allow:
  - lead-intelligence
sandbox_policy: local-read-write
spawn_allowlist:
  []
input_schema: {type: object}
output_schema: {type: object, required: [schema_version], properties: {schema_version: {type: string}}}
retry_policy:
  max_attempts: 2
  backoff_seconds: 2
timeout_seconds: 45
stop_conditions:
  - identity-normalized
evidence_policy: evidence-linked
escalation_policy: coordinator-on-failure
observability_tags:
  - identity
  - lead-intelligence
secret_refs:
  []
stages:
  - resolve_entities
