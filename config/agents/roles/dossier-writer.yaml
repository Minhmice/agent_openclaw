role_id: dossier-writer
display_name: Thảo My
execution_kind: llm
mission: Write a concise evidence-linked dossier and Discord portfolio summary.
non_goals:
  - Never add claims absent from structured evidence.
workspace: workflow/lead-intelligence/dossier
prompt_includes:
  - agents/shared/VIETNAMESE-LANGUAGE-POLICY.md
primary_model: configured-provider
fallback_model: configured-fallback
reasoning_budget_seconds: 120
tools_allow:
  - evidence-read
tools_deny:
  - exec
  - credential-read

skills_allow:
  - lead-intelligence
sandbox_policy: workspace-only
spawn_allowlist:
  []
input_schema: {type: object}
output_schema: {type: object, required: [schema_version], properties: {schema_version: {type: string}}}
retry_policy:
  max_attempts: 2
  backoff_seconds: 2
timeout_seconds: 180
stop_conditions:
  - evidence-only
evidence_policy: evidence-linked
escalation_policy: coordinator-on-failure
observability_tags:
  - dossier
  - delivery
secret_refs:
  []
stages:
  - human_approval
