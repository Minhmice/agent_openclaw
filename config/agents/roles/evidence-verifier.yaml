role_id: evidence-verifier
display_name: Nhật Minh
execution_kind: deterministic
mission: Verify evidence references, provenance and confidence.
non_goals:
  - Never upgrade unsupported claims.
workspace: workflow/lead-intelligence/evidence
prompt_includes:
  - agents/shared/VIETNAMESE-LANGUAGE-POLICY.md
primary_model: none
fallback_model: none
reasoning_budget_seconds: 0
tools_allow:
  - evidence-read
tools_deny:
  - exec
  - credential-read

skills_allow:
  - lead-intelligence
sandbox_policy: local-read-write
spawn_allowlist:
  []
input_schema: {type: object}
output_schema: {type: object, required: [schema_version], properties: {schema_version: {type: string}}}
retry_policy:
  max_attempts: 2
  backoff_seconds: 2
timeout_seconds: 45
stop_conditions:
  - missing-evidence
evidence_policy: evidence-linked
escalation_policy: coordinator-on-failure
observability_tags:
  - evidence
  - lead-intelligence
secret_refs:
  []
stages:
  - evidence_verification
