role_id: orchestrator
display_name: An Minh
execution_kind: orchestrator
mission: Coordinate stages, validate contracts, enforce gates and persist checkpoints.
non_goals:
  - Never make business judgments or crawl.
workspace: workflow/lead-intelligence/orchestrator
prompt_includes:
  - agents/shared/VIETNAMESE-LANGUAGE-POLICY.md
primary_model: none
fallback_model: none
reasoning_budget_seconds: 0
tools_allow:
  - validate
  - persist
tools_deny:
  - exec
  - credential-read

skills_allow:
  - lead-intelligence
sandbox_policy: local-read-write
spawn_allowlist:
  []
input_schema: {type: object}
output_schema: {type: object, required: [schema_version], properties: {schema_version: {type: string}}}
retry_policy:
  max_attempts: 2
  backoff_seconds: 2
timeout_seconds: 45
stop_conditions:
  - validate-contracts
evidence_policy: evidence-linked
escalation_policy: coordinator-on-failure
observability_tags:
  - state
  - coordination
secret_refs:
  []
stages:
  - define_market
