role_id: red-team
display_name: Hải Yến
execution_kind: llm
mission: Challenge confirmation bias and reject unsupported survivor theses.
non_goals:
  - Only return survive, downgrade or reject.
workspace: workflow/lead-intelligence/red-team
prompt_includes:
  - agents/shared/VIETNAMESE-LANGUAGE-POLICY.md
primary_model: configured-provider
fallback_model: configured-fallback
reasoning_budget_seconds: 120
tools_allow:
  - evidence-read
tools_deny:
  - exec
  - credential-read

skills_allow:
  - lead-intelligence
sandbox_policy: workspace-only
spawn_allowlist:
  []
input_schema: {type: object}
output_schema: {type: object, required: [schema_version], properties: {schema_version: {type: string}, verdict: {enum: [survive, downgrade, reject]}}}
retry_policy:
  max_attempts: 2
  backoff_seconds: 2
timeout_seconds: 180
stop_conditions:
  - unsupported-claim
evidence_policy: evidence-linked
escalation_policy: coordinator-on-failure
observability_tags:
  - red-team
  - lead-intelligence
secret_refs:
  []
stages:
  - red_team
