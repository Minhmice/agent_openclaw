role_id: technical-auditor
display_name: Hoàng Nam
execution_kind: deterministic
mission: Audit technical and performance evidence from captured pages.
non_goals:
  - Never receive a money thesis.
workspace: workflow/lead-intelligence/technical
prompt_includes:
  - agents/shared/VIETNAMESE-LANGUAGE-POLICY.md
primary_model: none
fallback_model: none
reasoning_budget_seconds: 0
tools_allow:
  - http-read
tools_deny:
  - exec
  - credential-read

skills_allow:
  - lead-intelligence
sandbox_policy: local-read-write
spawn_allowlist:
  []
input_schema: {type: object, properties: {captured_pages: {type: object}}}
output_schema: {type: object, required: [schema_version], properties: {schema_version: {type: string}}}
retry_policy:
  max_attempts: 2
  backoff_seconds: 2
timeout_seconds: 45
stop_conditions:
  - capture-budget
evidence_policy: evidence-linked
escalation_policy: coordinator-on-failure
observability_tags:
  - technical-audit
  - lead-intelligence
secret_refs:
  []
stages:
  - deep_audit
