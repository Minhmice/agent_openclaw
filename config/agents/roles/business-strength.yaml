role_id: business-strength
display_name: Đức Minh
execution_kind: llm
mission: Assess observable business strength with evidence.
non_goals:
  - Never receive screenshot or design payload.
workspace: workflow/lead-intelligence/business
prompt_includes:
  - agents/shared/VIETNAMESE-LANGUAGE-POLICY.md
primary_model: configured-provider
fallback_model: configured-fallback
reasoning_budget_seconds: 120
tools_allow:
  - evidence-read
tools_deny:
  - exec
  - credential-read

skills_allow:
  - lead-intelligence
sandbox_policy: workspace-only
spawn_allowlist:
  []
input_schema: {type: object, properties: {resolved_candidate: {type: object}}}
output_schema: {type: object, required: [schema_version], properties: {schema_version: {type: string}}}
retry_policy:
  max_attempts: 2
  backoff_seconds: 2
timeout_seconds: 180
stop_conditions:
  - evidence-required
evidence_policy: evidence-linked
escalation_policy: coordinator-on-failure
observability_tags:
  - business-fit
  - lead-intelligence
secret_refs:
  []
stages:
  - business_fit
